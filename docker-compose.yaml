services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.5.1
    container_name: keycloak
    environment:
      - KC_BOOTSTRAP_ADMIN_USERNAME=admin
      - KC_BOOTSTRAP_ADMIN_PASSWORD=admin
      - KC_HOSTNAME=keycloak
    volumes:
      - ./certs:/certs
    ports:
      - "8090:8080"
      - "8443:8443"
    command: start-dev --https-certificate-file=/certs/servers.pem --https-certificate-key-file=/certs/servers-key.pem
  trinodb:
    profiles:
      - manual
    build:
      context: ./keycloak-groups-plugin
      dockerfile: ../trino/container-image/Dockerfile
    container_name: trinodb
    env_file: "env_files/trino.env"
    volumes:
      - ./trino:/etc/trino
      - ./certs:/certs
    ports:
      - "8081:8080"
      - "8543:8543"
    depends_on:
      - keycloak
  initializer:
    build:
      context: ./pyscripts
      dockerfile: ./Dockerfile
    volumes:
      - ./certs:/certs
      - ./env_files:/env_files

  webapp:
    profiles:
      - manual
    build:
      context: ./python_auth_app
      dockerfile: ./Dockerfile
    container_name: webapp
    env_file: "env_files/webapp.env"
    ports:
      - "5555:5555"
    depends_on:
      - keycloak
