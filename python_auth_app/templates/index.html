<!DOCTYPE html>
<html>
<head>
    <title>Landing Page</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
        }
        .user-info {
            background: #f0f0f0;
            padding: 20px;
            border-radius: 8px;
            margin: 20px 0;
        }
        button, a.button {
            background: #007bff;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
        }
        button:hover, a.button:hover {
            background: #0056b3;
        }
    </style>
</head>
<body>
    <h1>Welcome to the Landing Page</h1>
    
    {% if user %}
        <div class="user-info">
            <h2>You are logged in!</h2>
            <p><strong>Name:</strong> {{ user.name or user.preferred_username }}</p>
            <p><strong>Email:</strong> {{ user.email }}</p>
            <p><strong>Username:</strong> {{ user.preferred_username }}</p>
        </div>
        <a href="/logout" class="button">Logout</a>
        <a href="/protected" class="button">Protected Route</a>
    {% else %}
        <p>Please log in to continue.</p>
        <a href="/login" class="button">Login with Keycloak</a>
    {% endif %}
</body>
</html>
